name: Sync files to consumer repos

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

concurrency:
  group: file-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.GH_PAT }}
          COMMIT_PREFIX: "chore:"