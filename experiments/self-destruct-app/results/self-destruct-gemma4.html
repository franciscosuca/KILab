<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Destruct Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(-2px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
        .animate-shake {
            animation: shake 0.5s infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .animate-shake {
                animation: none;
            }
        }
        .explosion-overlay {
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen overflow-hidden font-sans">

    <div id="main-container" class="relative p-12 bg-zinc-900 border border-zinc-800 rounded-3xl shadow-2xl text-center max-w-sm w-full transition-all duration-500">
        <div id="status-icon" class="mb-6 text-6xl">⚠️</div>
        <h1 id="main-title" class="text-2xl font-bold text-zinc-100 mb-2">System Core</h1>
        <p id="sub-title" class="text-zinc-500 text-sm mb-8">All systems operational. Status: Nominal.</p>

        <div id="action-area" class="relative h-24 flex items-center justify-center">
            <!-- Primary Button -->
            <button id="sd-button" class="group relative px-8 py-4 bg-red-600 hover:bg-red-500 text-white font-black rounded-xl tracking-widest uppercase transition-all active:scale-95 focus:outline-none focus:ring-4 focus:ring-red-900 disabled:opacity-50 disabled:cursor-not-allowed">
                <span id="btn-text">Self-Destruct</span>
            </button>

            <!-- Countdown Display (Hidden by default) -->
            <div id="countdown-display" class="hidden text-5xl font-mono font-black text-red-500">
                10
            </div>

            <!-- Cancel Button (Hidden by default) -->
            <button id="cancel-button" class="hidden px-6 py-2 text-zinc-400 hover:text-white border border-zinc-700 hover:border-zinc-500 rounded-lg text-sm transition-all focus:outline-none focus:ring-2 focus:ring-zinc-500">
                Abort Sequence
            </button>

            <!-- Reset Button (Hidden by default) -->
            <button id="reset-button" class="hidden px-6 py-2 bg-zinc-700 hover:bg-zinc-600 text-white rounded-lg text-sm transition-all focus:outline-none focus:ring-2 focus:ring-zinc-400">
                Reboot System
            </button>
        </div>

        <!-- Visual Destruction Overlay -->
        <div id="explosion" class="explosion-overlay absolute inset-0 bg-white opacity-0 z-50 rounded-3xl"></div>
    </div>

    <script>
        const sdButton = document.getElementById('sd-button');
        const cancelButton = document.getElementById('cancel-button');
        const resetButton = document.getElementById('reset-button');
        const countdownDisplay = document.getElementById('countdown-display');
        const mainTitle = document.getElementById('main-title');
        const subTitle = document.getElementById('sub-title');
        const statusIcon = document.getElementById('status-icon');
        const mainContainer = document.getElementById('main-container');
        const explosionOverlay = document.getElementById('explosion');
        const btnText = document.getElementById('btn-text');

        let countdownInterval;
        let timeLeft = 10;

        function updateUIForCountdown() {
            sdButton.classList.add('hidden');
            cancelButton.classList.remove('hidden');
            countdownDisplay.classList.remove('hidden');
            mainTitle.innerText = "CRITICAL FAILURE IMMINENT";
            mainTitle.classList.add('text-red-600');
            subTitle.innerText = "Immediate evacuation required.";
            statusIcon.innerText = "🚨";
            mainContainer.classList.add('animate-shake');
        }

        function stopCountdown() {
            clearInterval(countdownInterval);
            timeLeft = 10;
            
            sdButton.classList.remove('hidden');
            cancelButton.classList.add('hidden');
            countdownDisplay.classList.add('hidden');
            
            mainTitle.innerText = "System Core";
            mainTitle.classList.remove('text-red-600');
            subTitle.innerText = "All systems operational. Status: Nominal.";
            statusIcon.innerText = "⚠️";
            mainContainer.classList.remove('animate-shake');
        }

        function triggerDestruction() {
            clearInterval(countdownInterval);
            mainContainer.classList.remove('animate-shake');
            
            // Visual "Explosion"
            explosionOverlay.style.opacity = '1';
            
            setTimeout(() => {
                mainContainer.classList.add('opacity-0', 'scale-50');
                setTimeout(() => {
                    mainContainer.classList.remove('opacity-0', 'scale-50');
                    mainContainer.classList.add('bg-zinc-950', 'border-none', 'shadow-none');
                    mainContainer.innerHTML = `
                        <div class="text-zinc-700 text-xl font-mono">[SYSTEM_VOID]</div>
                        <button id="reboot-final" class="mt-8 px-6 py-2 text-zinc-500 hover:text-white transition-colors text-sm">
                            REINITIALIZE...
                        </button>
                    `;
                    document.getElementById('reboot-final').addEventListener('click', () => location.reload());
                }, 500);
            }, 300);
        }

        sdButton.addEventListener('click', () => {
            const confirmed = confirm("ARE YOU SURE? This action cannot be undone.");
            if (confirmed) {
                updateUIForCountdown();
                countdownInterval = setInterval(() => {
                    timeLeft--;
                    countdownDisplay.innerText = timeLeft;
                    
                    if (timeLeft <= 0) {
                        triggerDestruction();
                    }
                }, 1000);
            }
        });

        cancelButton.addEventListener('click', stopCountdown);
        
        resetButton.addEventListener('click', () => location.reload());

        // Keyboard support for buttons
        [sdButton, cancelButton, resetButton].forEach(btn => {
            btn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    btn.click();
                }
            });
        });
    </script>
</body>
</html>
